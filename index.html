var REVIEW_MS=25*60*1000,SHARE=0.8,MIN_WD=100,KEY='shopnar_reseller_v1';
var mem=null,D=load(),tab='login',view='home',timer=null;
function init(){return{users:{},products:[],wd:[],me:null}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):init()}catch(e){return init()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('ছবি বেশি বড়, সেভ করা যায়নি')}}
function $(s){return document.querySelector(s)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2600)}
function tk(n){return '৳'+Math.round(n).toLocaleString('en-US')}
function status(p){return Date.now()-p.created>=REVIEW_MS?'ok':'wait'}
function mine(){return D.products.filter(function(p){return p.owner===D.me})}
function earned(){return mine().reduce(function(s,p){return s+(p.sold||0)*(p.sell-p.buy)*SHARE},0)}
function withdrawn(){return D.wd.filter(function(w){return w.owner===D.me}).reduce(function(s,w){return s+w.amt},0)}
function balance(){return earned()-withdrawn()}
function render(){clearInterval(timer);D.me&&D.users[D.me]?dash():home();
 if(D.me&&mine().some(function(p){return status(p)==='wait'}))timer=setInterval(render,30000)}
function home(){
 var f=tab==='login'
 ?'<label>মোবাইল নাম্বার</label><input id="lp" inputmode="numeric" autocomplete="tel"><label>পাসওয়ার্ড</label><input id="lw" type="password" autocomplete="current-password"><div class="err" id="er"></div><button class="full" onclick="login()">লগইন করুন</button>'
 :'<label>আপনার নাম</label><input id="rn" autocomplete="name"><label>মোবাইল নাম্বার</label><input id="rp" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX"><label>ঠিকানা</label><textarea id="ra" rows="2" autocomplete="street-address"></textarea><label>পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label><input id="rw" type="password" autocomplete="new-password"><div class="err" id="er"></div><button class="full" onclick="reg()">রিসেলার হিসেবে যুক্ত হোন</button>';
 $('#app').innerHTML='<header><img class="lg" src="'+LOGO+'" alt="Shopnar Shop"></header><div class="hero"><div><h1>নিজের ব্যবসা শুরু করুন, ঝামেলা আমাদের</h1><p class="mute">আপনার প্রোডাক্ট আমাদের পেজে আমরা বিক্রি করে দেব। মার্কেটিংয়ের প্রায় সব কাজ আমরা সামলাব।</p><div class="split" aria-label="লাভের ভাগ"><div class="s80">আপনি পাবেন ৮০%</div><div class="s20">২০%</div></div><ul class="pts"><li>প্রোডাক্টের ছবি, দাম আর ক্যাপশন দিন</li><li>লাভ কত হবে সাথে সাথে দেখুন</li><li>বিকাশের মাধ্যমে টাকা তুলে নিন</li><li>কোনো সমস্যা হলে WhatsApp-এ সাহায্য পান</li></ul></div><div class="card"><div class="tabs"><button class="'+(tab==='login'?'on':'')+'" onclick="tab=\'login\';home()">লগইন</button><button class="'+(tab==='reg'?'on':'')+'" onclick="tab=\'reg\';home()">নতুন একাউন্ট</button></div>'+f+'</div></div>'}
function err(m){$('#er').textContent=m}
function reg(){var n=$('#rn').value.trim(),p=$('#rp').value.trim(),a=$('#ra').value.trim(),w=$('#rw').value;
 if(!n||!a)return err('নাম আর ঠিকানা দিন');
 if(!/^01\d{9}$/.test(p))return err('সঠিক ১১ ডিজিটের মোবাইল নাম্বার দিন');
 if(w.length<6)return err('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে');

 if(MKOK)return head+'<div class="card fcard"><h2>রিকোয়েস্ট জমা হয়েছে</h2><p>রিকোয়েস্ট #'+MKOK.id+' · মোট <b>$'+esc(MKOK.total)+'</b>। পেমেন্ট করলে মার্কেটিং শুরু হবে। পেমেন্ট কীভাবে করবেন, তা জানতে WhatsApp-এ মেসেজ করুন।</p><a class="mk" href="'+waMsg('মার্কেটিং রিকোয়েস্ট #'+MKOK.id+' (মোট $'+MKOK.total+') এর পেমেন্ট করতে চাই।')+'" target="_blank" rel="noopener">'+ic(IC.chat)+'WhatsApp-এ পেমেন্টের জন্য মেসেজ করুন</a><br><button class="sec" style="margin-top:12px" onclick="MKOK=null;dash()">নতুন রিকোয়েস্ট</button></div>'+mkHist()+mkHelp();
 if(!ps.length)return head+'<div class="card">মার্কেটিং করতে আগে একটি প্রোডাক্ট যোগ করুন।<br><button class="sm2" style="margin-top:10px" onclick="nav(\'add\')">+ প্রোডাক্ট যোগ করুন</button></div>'+mkHelp();
 var opts=ps.map(function(p){return '<option value="'+p.id+'"'+(MP===p.id?' selected':'')+'>'+esc(p.code)+' · '+esc(p.cap.slice(0,28))+(status(p)==='wait'?' (রিভিউতে)':'')+'</option>'}).join('');
 var pf=PF.map(function(x){return '<div class="pfr"><b>'+x[1]+'</b><div class="usd"><span>$</span><input id="ma_'+x[0]+'" type="number" min="0" step="0.5" inputmode="decimal" oninput="mkCalc()" placeholder="0"></div></div>'}).join('');
 return head+'<div class="card fcard"><h2>মার্কেটিং প্ল্যান</h2><p class="mute" style="margin:0 0 4px;font-size:14px">কোন প্রোডাক্টের, কত ডলার, কত দিন ও কাদের কাছে প্রচার হবে, ঠিক করুন।</p>'
 +'<label>কোন প্রোডাক্টের মার্কেটিং?</label><select id="mp">'+opts+'</select>'
 +'<label>কোন প্ল্যাটফর্মে কত ডলার? (যেটায় দেবেন না, ফাঁকা রাখুন)</label>'+pf
 +'<div class="calc" id="mtot">মোট: $0</div>'
 +'<label>কতদিন মার্কেটিং চলবে? (দিন)</label><input id="md" type="number" min="1" max="365" inputmode="numeric" value="7">'
 +'<label>টার্গেট কারা?</label><select id="mg"><option>সবাই</option><option>পুরুষ</option><option>নারী</option></select>'
 +'<input id="mi" style="margin-top:8px" placeholder="আগ্রহ/এলাকা, যেমন: ঢাকার তরুণ, ফ্যাশনে আগ্রহী">'
 +'<label>বয়স (থেকে – পর্যন্ত)</label><div class="row"><input id="mag1" type="number" min="13" max="65" inputmode="numeric" value="18"><input id="mag2" type="number" min="13" max="65" inputmode="numeric" value="45"></div>'
 +'<div class="err" id="er"></div><button class="full" onclick="mkSubmit()">মার্কেটিং কনফার্ম করুন</button><p class="mute" style="font-size:13px;margin:10px 0 0">কনফার্ম করলে রিকোয়েস্ট আমাদের কাছে পৌঁছাবে। এরপর ডলারের টাকা পরিশোধ করলে মার্কেটিং শুরু হবে।</p></div>'+mkHelp()+mkHist()};
function mkCalc(){var t=0;PF.forEach(function(x){var v=+$('#ma_'+x[0]).value;if(v>0)t+=v});$('#mtot').textContent='মোট: $'+(Math.round(t*100)/100)}
async function mkSubmit(){var pid=+$('#mp').value,days=+$('#md').value,a1=+$('#mag1').value,a2=+$('#mag2').value,gen=$('#mg').value,it=$('#mi').value.trim(),pl={},tot=0;
 PF.forEach(function(x){var v=+$('#ma_'+x[0]).value;if(v>0){pl[x[0]]=v;tot+=v}});
 if(!pid)return err('প্রোডাক্ট নির্বাচন করুন');
 if(!tot)return err('অন্তত একটি প্ল্যাটফর্মে ডলারের পরিমাণ দিন');
 if(!days||days<1||days>365)return err('সময়কাল ১ থেকে ৩৬৫ দিনের মধ্যে দিন');
 if(!it)return err('কাদের টার্গেট করবেন, সেটা লিখুন');
 if(!a1||!a2||a1<13||a2>65||a1>a2)return err('বয়স ১৩ থেকে ৬৫-এর মধ্যে হতে হবে (শুরু ≤ শেষ)');
 busy(true);var uid=(await SB.auth.getUser()).data.user.id;
 var r=await SB.from('marketing_requests').insert({user_id:uid,product_id:pid,days:days,age_min:a1,age_max:a2,audience:gen+' · '+it,platforms:pl}).select('id,total_usd').single();
 if(r.error){busy(false);return err(/marketing_requests|schema cache/.test(r.error.message)?'মার্কেটিং ফিচার এখনো চালু হয়নি। (Supabase-এ নতুন SQL Run বাকি)':errMsg(r.error))}
 MKOK={id:r.data.id,total:r.data.total_usd};MP=null;await loadAll();dash()}

boot();
</script>
